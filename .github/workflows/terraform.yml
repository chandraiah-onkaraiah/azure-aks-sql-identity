name: Terraform

on:
  push:
    branches:
      - master
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - master
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC token request
  contents: read    # Required to checkout the repo
  pull-requests: write  # Required to post plan output as a PR comment

env:
  TF_VERSION: "1.9.5"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # ARM_USE_OIDC tells the AzureRM provider to use the OIDC token
  # instead of a client secret — no ARM_CLIENT_SECRET needed
  ARM_USE_OIDC: "true"

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .   # All tf files are at the repo root

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. OIDC login to Azure ─────────────────────────────────────────────
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 3. Setup Terraform ─────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 4. Terraform Init ──────────────────────────────────────────────────
      - name: Terraform Init
        run: terraform init

      # ── 5. Terraform Format check ──────────────────────────────────────────
      - name: Terraform Format Check
        run: terraform fmt -recursive
        continue-on-error: true

      # ── 6. Terraform Validate ──────────────────────────────────────────────
      - name: Terraform Validate
        run: terraform validate

      # ── 7. Terraform Plan (always runs) ───────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      # ── 8. Post plan output as PR comment ──────────────────────────────────
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.slice(0, 60000) + '\n\n... output truncated ...'
              : planOutput;

            const body = `## Terraform Plan

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Plan status:** \`${{ steps.plan.outcome }}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # ── 9. Fail if plan failed ─────────────────────────────────────────────
      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # ── 10. Terraform Apply (master branch only) ─────────────────────────────
      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          terraform apply \
            -auto-approve \
            tfplan
